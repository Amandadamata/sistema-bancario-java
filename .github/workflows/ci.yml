name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        # 17 is the minimum supported version; 21 and 25 are later LTS releases.
        java: ['17', '21', '25']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Run the packaged JAR
        run: |
          printf '0\n' | LINHA_DB="$RUNNER_TEMP/smoke.db" \
            java -jar target/linha-banking-system-*.jar --terminal | grep 'Goodbye'

  desktop-ui:
    # Swing flows need a display, so they run on a virtual one, on the minimum supported Java.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with UI flows
        run: xvfb-run -a ./mvnw --batch-mode -Pui-tests verify
